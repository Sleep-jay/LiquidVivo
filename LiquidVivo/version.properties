# LiquidVivo 版本号文件（构建时由 build.gradle.kts 读取）
#
# 版本号规则：
#   格式: major.minor.patch  +  versionCode（整数，每次发布 +1）
#   1. patch 为个位数：0~9 递增，每次发布 +1
#   2. patch 到 9 后进位：minor +1、patch 归 0
#      示例: 1.3.9 → 1.4.0、1.4.9 → 1.5.0
#   3. 重大变更才动 major（1.x → 2.0.0）
#   4. versionCode 单调递增、永不复用；跳号避开已废弃/已装机的版本
#      （1.3.9~1.3.11(25-27) 为废弃的 noinstall 实验，永久跳过）
#   5. 禁止降级：新版 versionCode 必须大于任何已发布版本
#
# 当前版本：
versionCode=50
versionName=1.7.4
